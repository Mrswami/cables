name: Cables Audio Engine — CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch so only the latest counts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # 1. LINT
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

  # ─────────────────────────────────────────
  # 2. BUILD
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Vite Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Verify build output
        run: |
          echo "── Build output contents ──"
          ls -lh desktop/
          echo ""
          test -f desktop/index.html && echo "✅ desktop/index.html present" || (echo "❌ desktop/index.html missing" && exit 1)

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cables-dist-${{ github.sha }}
          path: desktop/
          retention-days: 7

  # ─────────────────────────────────────────
  # 3a. DEPLOY PREVIEW (Pull Requests)
  # ─────────────────────────────────────────
  deploy-preview:
    name: 🔍 Deploy Preview (PR)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && secrets.FIREBASE_SERVICE_ACCOUNT_CABLES_VISUALIZER != ''
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: cables-dist-${{ github.sha }}
          path: desktop/

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CABLES_VISUALIZER }}
          projectId: cables-visualizer
          target: cables
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

  # ─────────────────────────────────────────
  # 3b. DEPLOY PRODUCTION (push to main with secret)
  # ─────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.FIREBASE_SERVICE_ACCOUNT_CABLES_VISUALIZER != ''

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: cables-dist-${{ github.sha }}
          path: desktop/

      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CABLES_VISUALIZER }}
          projectId: cables-visualizer
          target: cables
          channelId: live

      - name: Deployment summary
        run: |
          echo "## ✅ Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** cables-visualizer" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://cables.web.app" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # 3c. DEPLOY NOTICE (when secret not yet configured)
  # ─────────────────────────────────────────
  deploy-notice:
    name: ℹ️ Deployment Guide
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.FIREBASE_SERVICE_ACCOUNT_CABLES_VISUALIZER == ''
    steps:
      - name: Setup Guide
        run: |
          echo "## ℹ️ Build Successful — CI/CD Active" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vite build and Oxlint verification passed with zero errors. 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To enable automatic Firebase deploy from GitHub Actions:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to [Firebase Console](https://console.firebase.google.com/project/cables-visualizer/settings/serviceaccounts/adminsdk) -> **Generate new private key**." >> $GITHUB_STEP_SUMMARY
          echo "2. In GitHub repository: **Settings** -> **Secrets and variables** -> **Actions** -> **New repository secret**." >> $GITHUB_STEP_SUMMARY
          echo "3. **Name:** \`FIREBASE_SERVICE_ACCOUNT_CABLES_VISUALIZER\`" >> $GITHUB_STEP_SUMMARY
          echo "4. **Value:** Paste the contents of the generated JSON service account file." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Live hosting is actively running at: https://cables.web.app" >> $GITHUB_STEP_SUMMARY
